<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Juegos Comando Garra</title>
<style>
:root{
  --bg:#0f2a1d; --bg2:#143825; --card:#1b4a31; --card2:#235c3d; --line:#2f7350;
  --ink:#fdf8ee; --muted:#c9dccd; --red:#e2433b; --red2:#b8302a; --gold:#f5c542; --ok:#5fd38d; --blue:#5aa9f0;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f2a1d;--ink:#fdf8ee}}
:root[data-theme="dark"]{--bg:#0f2a1d;--ink:#fdf8ee}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 20% 0%,#1d4d33 0,var(--bg) 55%)}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:.7em 1.1em;background:var(--card2);color:var(--ink);font-weight:700;transition:transform .08s,filter .15s}
button:hover{filter:brightness(1.12)} button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed}
.b-red{background:var(--red)} .b-gold{background:var(--gold);color:#3a2a00} .b-ok{background:var(--ok);color:#073b1d} .b-ghost{background:transparent;border:2px solid var(--line)}
.big{font-size:1.25em;padding:.8em 1.4em}
input,select,textarea{font:inherit;padding:.6em .8em;border-radius:12px;border:2px solid var(--line);background:#0c2217;color:var(--ink);max-width:100%}
textarea{width:100%;min-height:5em}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.15}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:rgba(0,0,0,.25);border-bottom:2px solid var(--line)}
.top .brand{font-size:1.3em;font-weight:800}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:.3em .8em;border-radius:999px;background:var(--card);font-weight:700}
.card{background:var(--card);border-radius:var(--r);padding:18px;border:2px solid var(--line)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.center{text-align:center}
.prompt{font-size:clamp(1.6rem,4.2vw,3.2rem);font-weight:800;line-height:1.15;text-align:center;margin:.4em 0}
.huge{font-size:clamp(2.2rem,7vw,5.5rem);font-weight:900;text-align:center;line-height:1.05}
.chip{display:inline-flex;align-items:center;gap:6px;padding:.35em .7em;border-radius:999px;background:var(--card2);margin:3px;font-weight:700}
.chip .x{background:none;padding:0 .2em;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:#7a8a80;display:inline-block}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.gamebtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:18px;background:var(--card);border:2px solid var(--line);min-height:120px}
.gamebtn .e{font-size:2.2em}
.gamebtn .t{font-size:1.15em}
.gamebtn .d{font-weight:400;color:var(--muted);font-size:.9em}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0}
.bar .n{width:150px;font-weight:800;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t{flex:1;background:#0c2217;border-radius:10px;height:34px;overflow:hidden}
.bar .f{height:100%;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:10px;transition:width 1s}
.bar .c{width:40px;font-weight:800}
.timer{font-size:clamp(2rem,6vw,4rem);font-weight:900;font-variant-numeric:tabular-nums}
.timer.low{color:var(--red)}
details{margin:8px 0} summary{cursor:pointer;font-weight:700;color:var(--gold)}
.rules li{margin:.35em 0}
.ansbox{background:#0c2217;border-radius:14px;padding:14px 16px;font-size:1.3em;font-weight:700;margin:8px 0;display:flex;gap:12px;align-items:center}
.ansbox .num{background:var(--gold);color:#3a2a00;border-radius:50%;min-width:38px;height:38px;display:grid;place-items:center}
.ansbox.win{outline:3px solid var(--gold)}
.tag{font-size:.75em;padding:.15em .55em;border-radius:8px;background:var(--card2);color:var(--muted);font-weight:700}
.gift{position:relative;border-radius:16px;padding:12px;background:var(--card2);border:2px solid var(--line);min-height:120px;display:flex;flex-direction:column;gap:4px}
.gift.closed{background:repeating-linear-gradient(45deg,#b8302a 0 18px,#cf3b33 18px 36px);border-color:var(--gold)}
.gift.frozen{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset}
.gift .gn{font-weight:900;font-size:1.3em}
.gift .gd{font-weight:800;font-size:1.05em}
.gift .go{color:var(--gold);font-weight:800}
.gift .acts{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.order{display:flex;gap:6px;flex-wrap:wrap}
.order .o{padding:.35em .7em;border-radius:10px;background:var(--card2);font-weight:700}
.order .o.cur{background:var(--gold);color:#3a2a00}
.order .o.done{opacity:.55}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--bg2);border:3px solid var(--gold);border-radius:24px;padding:22px;max-width:760px;width:100%;max-height:94vh;overflow:auto;text-align:center}
.wheelwrap{position:relative;width:min(48vh,80vw,460px);aspect-ratio:1;margin:10px auto}
.wheelwrap svg{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.12,.75,.12,1)}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid var(--gold);filter:drop-shadow(0 2px 2px #000);z-index:2}
.result{font-size:clamp(1.4rem,3.5vw,2.4rem);font-weight:900;background:var(--red);border-radius:18px;padding:16px;margin:12px 0}
.qr{background:#fff;border-radius:16px;padding:10px;display:inline-block;line-height:0}
.qr svg{width:220px;height:220px}
.code{font-size:2.4em;font-weight:900;letter-spacing:.15em;color:var(--gold)}
.team{border-radius:16px;padding:14px}
.team.a{background:#5c1f1c;border:2px solid var(--red)}
.team.b{background:#163a5c;border:2px solid var(--blue)}
.team.active{box-shadow:0 0 0 4px var(--gold)}
.score{font-size:2.6em;font-weight:900}
.secret{background:#000;border-radius:18px;padding:24px;margin:10px 0}
.pcard{position:relative;background:var(--card2);border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.pcard .pdel{position:absolute;top:4px;right:6px;background:none;padding:0;color:var(--muted)}
.av{border-radius:50%;object-fit:cover;vertical-align:middle;border:2px solid var(--gold)}
.ave{line-height:1;vertical-align:middle}
.emo{font-size:1.8em;padding:.25em;margin:3px;background:var(--card2)}
.emo.sel{background:var(--gold)}
.snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.snow i{position:absolute;top:-10px;color:#fff;opacity:.5;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}
main{position:relative;z-index:1}
.shuffle{font-size:clamp(2rem,6vw,4.5rem);font-weight:900;color:var(--gold);text-align:center;padding:30px}
/* phone */
.phone{max-width:520px;margin:0 auto;padding:16px}
.phone .opt{display:block;width:100%;margin:8px 0;padding:16px;font-size:1.25em;text-align:left;background:var(--card2);border:2px solid var(--line)}
.phone .opt.sel{background:var(--gold);color:#3a2a00}
.status{font-size:.85em;color:var(--muted)}
@media (max-width:600px){.bar .n{width:90px}.top .brand{font-size:1.1em}}
</style>
</head>
<body>
<div class="snow" id="snow"></div>
<main id="app"></main>
<div id="modal"></div>

        var b = bin.read();

        return b;

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];

            } else {

              bytes.push(b & 0xff);
            }
          } else {

          }
        }
      }
      return bytes;
    };

      out.writeByte(0xff);

      };

      };

      };

    };

const EMOJIS=['🎅','🤶','🦌','⛄','🎄','🌟','🐧','🐻','🦊','🐱','🐶','🐵','🦁','🐸','🦄','🐙','🦖','🤖','👽','🥳','😎','🤠','🧙','🦸'];

/* ---------- pantallas ---------- */

/* --- 1. Quién es más probable --- */
SCREENS.quien=()=>{
  const g=S.g; const opts=S.players.map(p=>({id:p.pid,label:p.name}));
  let body=needPlayers(3);
  if(!body){
    if(!g.prompt) body=`<div class="card center"><p class="prompt">¿Listos?</p><button class="b-gold big" onclick="A.qNext()">Sacar pregunta</button></div>`;
    else{
      const counts=countVotes(g); const max=Math.max(0,...Object.values(counts)); const top=max?Object.keys(counts).filter(k=>counts[k]===max):[];
      body=`<div class="card"><p class="muted center">¿Quién es más probable que…</p><p class="prompt">${esc(g.prompt)}?</p>
      ${g.phase==='ask'?`<div class="center"><button class="b-gold big" onclick="A.qOpen()">📱 Abrir votación</button> <button class="b-ghost" onclick="A.qNext()">Otra pregunta</button></div>`:''}
      ${g.phase==='vote'?votedLine(g,S.players.map(p=>p.pid))+`<div class="center"><button class="b-red big" onclick="A.qReveal()">🥁 Revelar</button></div>`+manualTally(g,opts):''}
      ${g.phase==='reveal'?tallyHtml(counts,opts,top)+`<div class="row" style="justify-content:center;margin-top:12px">${top.length?punishBtn(pick(top)):''}<button class="b-gold" onclick="A.qNext()">Siguiente pregunta ➜</button></div>`:''}
      </div>`;
    }
  }
  return header('🤔','¿Quién es más probable…?',['Sale una pregunta en la pantalla.','Cada uno vota en su celular por la persona de la mesa que más calza (puedes votar por ti).','Al revelar se ven los nombres: el más votado se gana una vuelta en la ruleta del castigo.'])+body;
};
/* --- 3. Ruleta --- */
SCREENS.ruleta=()=>{
  const opts=S.players.length?playerOpts(S.ruletaVictim,'rv'):'';
  return header('🎡','Ruleta del castigo',['Se usa cuando alguien pierde en otro juego (aparece el botón 🎡 en cada juego).','También se puede girar acá para quien quieran.','El comodín 🍀 salva; el 😈 le pasa el castigo a otro.'])+
  `<div class="card center"><div class="row" style="justify-content:center">${S.players.length?'<span>Víctima:</span>'+opts:''}<button class="b-ghost" onclick="A.randV()">🎲 Al azar</button><button class="b-red big" onclick="A.punish(($('#rv')||{}).value||null)">🎡 ¡Girar!</button></div>
  <div class="wheelwrap" style="width:min(50vh,80vw,420px)"><div class="pointer"></div>${wheelSVG()}</div></div>
  <details><summary>✏️ Editar castigos</summary><p class="muted">Uno por línea: emoji, espacio y el castigo.</p><textarea id="cast" style="min-height:14em">${esc(S.castigos.map(c=>c.join(' ')).join('\n'))}</textarea><div class="row"><button onclick="A.saveCast()">Guardar</button><button class="b-ghost" onclick="A.resetCast()">Volver a los originales</button></div></details>`;
};
/* --- 4. Dos verdades --- */
SCREENS.dos=()=>{
  const g=S.g; let body=needPlayers(3);
  if(!body){
    const opts=[1,2,3].map(n=>({id:String(n),label:'Frase '+n}));
    if(!g.teller) body=`<div class="card center"><p>¿Quién parte?</p>${playerOpts(S.players[0].pid,'dteller')}<button class="b-gold big" onclick="A.dStart($('#dteller').value)">Empezar</button></div>`;
    else{
      const voters=S.players.map(p=>p.pid).filter(p=>p!==g.teller); const counts=countVotes(g);
      body=`<div class="card"><p class="huge">${av(g.teller,'1em')} ${esc(nm(g.teller))}</p>${g.stmts?g.stmts.map((x,i)=>`<div class="ansbox"><span class="num">${i+1}</span>${esc(x)}</div>`).join(''):'<p class="prompt" style="font-size:1.6em">dice 3 cosas de su vida, en orden: frase 1, 2 y 3.<br>Dos son verdad y una es mentira. 🕵️</p>'}
      ${g.phase==='vote'?votedLine(g,voters)+`<div class="center"><p>¿Cuál era la mentira? ${g.lie?'<b>✅ Ya está marcada en secreto</b>':`<span class="muted">(${esc(nm(g.teller))} la marca en su celular, o aquí sin que nadie mire)</span>`}</p>
        <div class="row" style="justify-content:center">${[1,2,3].map(n=>`<button class="b-ghost" onclick="A.dLie('${n}')">${g.lie===String(n)?'●':'○'} ${n}</button>`).join('')}</div>
        <p><button class="b-red big" ${g.lie?'':'disabled'} onclick="A.dReveal()">🥁 Revelar</button></p></div>`+manualTally(g,opts):''}
      ${g.phase==='reveal'?`<p class="huge" style="color:var(--gold)">¡La mentira era la ${esc(g.lie)}!</p>${tallyHtml(counts,opts,[g.lie])}
        <p class="center">${g.winners.length?'✅ Le achuntaron (+1): '+g.winners.map(p=>esc(nm(p))).join(', '):'¡Nadie le achuntó!'}${g.fooled?` · 🎉 ${esc(nm(g.teller))} engañó a la mayoría (+2)`:''}</p>
        <div class="row" style="justify-content:center">${g.losers.length?punishBtn(pick(g.losers)):''}<button class="b-gold" onclick="A.dNext()">Siguiente jugador ➜</button></div>`:''}
      </div>`;
    }
  }
  return header('🕵️','Dos verdades y una mentira',['Por turno, una persona cuenta 3 cosas de su vida: dos verdaderas y una inventada.','Los demás votan en el celular cuál es la mentira.','Quien le achunta suma 1 punto. Si la mayoría se equivoca, el que contó suma 2.','Uno de los que se equivocaron va a la ruleta.'])+body;
};
/* --- 5. Imitaciones --- */
SCREENS.imita=()=>{
  const g=S.g; let body=needPlayers(3);
  if(!body){
    const modes=[['mesa','Personas de la mesa'],['pers','Personajes'],['mix','Mezcla']];
    const modeRow=`<div class="row" style="justify-content:center">${modes.map(([k,l])=>`<button class="${S.imitaMode===k?'b-gold':'b-ghost'}" onclick="A.imMode('${k}')">${l}</button>`).join('')}</div>`;
    if(!g.imitator) body=`<div class="card center"><p>¿A quién imitar?</p>${modeRow}<p><button class="b-gold big" onclick="A.imNew()">🎭 Sortear imitador</button></p></div>`;
    else{
      const el=g.start?Math.floor((Date.now()-g.start)/1000):0;

      ${g.phase==='ready'?`<p>${online(g.imitator)?'📱 Le llegó el secreto a su celular.':'No tiene celular: que mire solo él/ella.'}</p>
        <div class="row" style="justify-content:center"><button class="b-ghost" onclick="A.imPeek()">👀 Ver secreto (solo ${esc(nm(g.imitator))})</button><button class="b-gold big" onclick="A.imGo()">▶️ ¡Empezar!</button><button class="b-ghost" onclick="A.imNew()">Sortear otro</button></div>`:''}
      ${g.phase==='acting'?`<div class="timer" id="imtimer">${el}s</div><p>¿Quién adivinó?</p><div class="row" style="justify-content:center">${S.players.filter(p=>p.pid!==g.imitator).map(p=>`<button onclick="A.imGot('${p.pid}')">${esc(p.name)}</button>`).join('')}</div>
        <p><button class="b-red" onclick="A.imFail()">😵 Nadie adivinó</button></p>`:''}
      ${g.phase==='done'?`<p class="prompt">Era: ${esc(g.target)}</p><p>${g.guesser?`🎉 Adivinó ${esc(nm(g.guesser))} en ${g.secs}s (+1 para los dos)`:'Nadie adivinó…'}</p>
        <div class="row" style="justify-content:center">${g.guesser?'':punishBtn(g.imitator)}<button class="b-gold" onclick="A.imNew()">Siguiente ➜</button></div>`:''}

};
/* --- 6. Respuestas absurdas --- */
SCREENS.absurdas=()=>{
  const g=S.g; let body=needPlayers(3);
  if(!body){
    if(!g.prompt) body=`<div class="card center"><p class="prompt">¿Listos para responder tonteras?</p><button class="b-gold big" onclick="A.aNext()">Sacar frase</button></div>`;
    else{
      const fill=t=>esc(g.prompt).replace('____','<span style="color:var(--gold)">'+(t?esc(t):'______')+'</span>');
      const wrote=Object.keys(g.texts);
      body=`<div class="card"><p class="prompt">${fill()}</p>
      ${g.phase==='write'?`<p class="center muted">Escriban en el celular. Respondieron: <b>${wrote.length}</b> ${wrote.length?'· ✅ '+wrote.map(p=>esc(nm(p))).join(', '):''}</p>
        <div class="center"><button class="b-gold big" ${wrote.length<2?'disabled':''} onclick="A.aShow()">📜 Ver respuestas y votar</button></div>
        <details><summary>Agregar respuesta a mano (sin celular)</summary><div class="row" style="margin-top:8px">${playerOpts(null,'aw')}<input id="atxt" placeholder="Respuesta" maxlength="80"><button onclick="A.aMan()">Agregar</button></div></details>`:''}
      ${g.phase==='vote'?g.order.map((pid,i)=>`<div class="ansbox"><span class="num">${i+1}</span>${esc(g.texts[pid])}</div>`).join('')+votedLine(g,S.players.map(p=>p.pid))+`<div class="center"><button class="b-red big" onclick="A.aReveal()">🥁 Revelar</button></div>`+manualTally(g,g.order.map((pid,i)=>({id:pid,label:'#'+(i+1)}))):''}
      ${g.phase==='reveal'?(()=>{const c=countVotes(g);const max=Math.max(0,...Object.values(c));return g.order.slice().sort((a,b)=>(c[b]||0)-(c[a]||0)).map(pid=>`<div class="ansbox ${max&&c[pid]===max?'win':''}">${max&&c[pid]===max?'👑':''}<div style="flex:1">${esc(g.texts[pid])}<div class="muted" style="font-size:.7em">— ${esc(nm(pid))}</div></div><span class="tag">${c[pid]||0} votos</span></div>`).join('')+`<div class="row" style="justify-content:center;margin-top:10px">${g.last?punishBtn(g.last):''}<button class="b-gold" onclick="A.aNext()">Siguiente frase ➜</button></div>`})():''}
      </div>`;
    }
  }
  return header('🤪','Respuestas absurdas',['Sale una frase con un espacio en blanco.','Cada uno escribe en su celular la respuesta más chistosa (¡nada de groserías, hay niños!).','Se muestran sin nombre y todos votan por la mejor (no puedes votar por la tuya).','La más votada suma 1 punto. La menos votada puede ir a la ruleta.'])+body;
};
/* --- 8. Mímica --- */
SCREENS.mimica=()=>{
  const T=S.teams, g=S.g; let body=needPlayers(4);
  if(!body){
    const teamBox=k=>`<div class="team ${k} ${T.turn===k&&g.phase!=='playing'?'active':''} ${T.turn===k&&g.phase==='playing'?'active':''}"><div class="row" style="justify-content:space-between"><h2>${k==='a'?'🔴 Rojos':'🔵 Azules'}</h2><span class="score">${k==='a'?T.sa:T.sb}</span></div><div>${T[k].map(pid=>`<span class="chip" onclick="A.mSwap('${pid}')" title="Cambiar de equipo" style="cursor:pointer">${esc(nm(pid))}</span>`).join('')}</div></div>`;
    const ready=T.a.length&&T.b.length;
    let mid='';
    if(!ready) mid=`<div class="card center"><button class="b-gold big" onclick="A.mTeams()">🎲 Armar equipos al azar</button></div>`;
    else if(g.phase==='playing'){
      mid=`<div class="card center"><p>Actúa <b>${esc(nm(g.actor))}</b> (${T.turn==='a'?'🔴':'🔵'})</p><div class="timer" id="mmtimer">${T.secs}</div>
      <p>${online(g.actor)?'📱 La palabra está en su celular.':''}</p>
      <div class="row" style="justify-content:center"><button class="b-ghost" onclick="A.mPeek()">👀 Ver palabra (solo actor)</button><button class="b-ok big" onclick="A.mGot()">✅ ¡Adivinaron!</button><button class="b-ghost big" onclick="A.mSkip()">⏭ Pasar</button></div>
      <p class="muted">Llevan: ${g.got.length} ✅</p></div>`;
    }else{
      const team=T[T.turn]; const actor=team[(T.turn==='a'?T.ia:T.ib)%team.length];
      mid=`<div class="card center">${g.phase==='end'?`<p class="prompt">⏰ ¡Tiempo! ${g.got.length} puntos para ${g.team==='a'?'🔴 Rojos':'🔵 Azules'}</p><p class="muted">${g.got.map(esc).join(' · ')}</p>`:''}
      <p>Turno de ${T.turn==='a'?'🔴 Rojos':'🔵 Azules'} · actúa <b>${esc(nm(actor))}</b></p>
      <div class="row" style="justify-content:center"><button class="b-gold big" onclick="A.mStart()">▶️ Empezar ${T.secs}s</button><select id="msecs" onchange="A.mSecs(this.value)">${[45,60,90].map(s=>`<option ${s===T.secs?'selected':''} value="${s}">${s} seg</option>`).join('')}</select>
      <button class="b-ghost" onclick="A.mTeams()">Rearmar equipos</button><button class="b-ghost" onclick="A.mReset()">Puntos a 0</button></div></div>`;
    }
    body=`<div class="grid g2">${teamBox('a')}${teamBox('b')}</div><div style="margin-top:14px">${mid}</div>`;
  }
  return header('🙌','Mímica a la carrera',['Dos equipos. Por turno, alguien actúa sin hablar ni hacer sonidos.','Le llega la palabra al celular (o mira la pantalla a escondidas).','Su equipo tiene que adivinar todas las palabras que pueda antes de que se acabe el tiempo. Se puede pasar.','Cada palabra adivinada es 1 punto para el equipo. Toca un nombre para cambiarlo de equipo.'])+body;
};
/* --- 10. Amigo Secreto Robado --- */
SCREENS.asr=()=>{
  const R=S.asr;
  const p1=R?R.peaje:false, nch=R&&R.nchal!=null?R.nchal:2, mx=(R&&R.max)||3;
  const rules=['Se sortea el orden. Hay un regalo envuelto por persona, numerados.','<b>1ª vuelta (libre):</b> en tu turno <b>abres un regalo nuevo</b> o <b>robas uno ya abierto</b>'+(p1?' (pagando peaje: giras la ruleta y cumples el castigo 🎡).':'.'),'Si abres uno nuevo y no te gusta, puedes cambiarlo por uno ya abierto: el otro se queda con el que abriste.','Al que le robaron juega de inmediato: abre uno nuevo o roba otro. <b>No puede recuperar al tiro el que le acaban de quitar.</b>','Un regalo robado <b>'+mx+' veces</b> queda congelado 🔒 y ya no se mueve.','El turno termina cuando alguien abre un regalo nuevo (y decide si se lo queda o lo cambia).',nch?'<b>'+(nch===2?'2ª y 3ª vuelta':'2ª vuelta')+' (con desafío):</b> de nuevo en orden, cada uno puede intentar quedarse con un regalo no congelado. Para eso debe ganar un <b>desafío</b> que sale de la ruleta de juegos: imitación, mímica, dos verdades y una mentira, duelo de respuestas absurdas, duelo de ¿quién es más probable? o ruleta del castigo. Si gana, intercambian regalos; si pierde, se queda con el suyo.':'Cuando se abre el último regalo, termina el juego.','Cada decisión tiene tiempo: si se acaba, ¡a decidir ya!'];
  if(!R||R.phase==='setup'){
    const sel=(R&&R.sel)||S.players.map(p=>p.pid);
    return header('🎁','El Gran Juego: Amigo Secreto Robado',null)+`<div class="grid g2"><div class="card"><h2>Reglas</h2><ol class="rules">${rules.map(r=>'<li>'+r+'</li>').join('')}</ol></div>
    <div class="card"><h2>Preparar</h2><p>¿Quiénes participan? (uno por regalo)</p><div>${S.players.map(p=>`<label class="chip"><input type="checkbox" class="asrp" value="${p.pid}" ${sel.includes(p.pid)?'checked':''}> ${av(p.pid)} ${esc(p.name)}</label>`).join('')}</div>
    <div class="row" style="margin-top:10px"><label>Vueltas con desafío <select id="achal"><option value="2" selected>2 (total 3 vueltas)</option><option value="1">1 (total 2 vueltas)</option><option value="0">0 (solo vuelta libre)</option></select></label>
    <label>Robos para congelar <select id="amax">${[2,3,4].map(n=>`<option ${n===3?'selected':''}>${n}</option>`).join('')}</select></label>
    <label>Tiempo por decisión <select id="asecs">${[30,60,90,120].map(n=>`<option ${n===60?'selected':''} value="${n}">${n} seg</option>`).join('')}</select></label>
    <label class="chip"><input type="checkbox" id="apeaje"> Peaje con ruleta también en la 1ª vuelta</label></div>
    <p><button class="b-gold big" onclick="A.asrStart()" ${S.players.length<3?'disabled':''}>🎲 Sortear orden y empezar</button></p></div></div>`;
  }
  if(R.phase==='shuffle') return header('🎁','El Gran Juego',null)+`<div class="card"><p class="center">Sorteando el orden…</p><div class="shuffle" id="shuf">🎲</div></div>`;
  const giftOf=pid=>R.gifts.findIndex(g=>g.owner===pid);
  const canSteal=gi=>{const g=R.gifts[gi];if(!g.opened||g.steals>=R.max)return false;
    if(R.phase==='final'){if(R.chal)return false;const mine=giftOf(R.actor);return g.owner!==R.actor&&!(mine>=0&&R.gifts[mine].steals>=R.max)}
    if(R.pending)return gi!==R.pending.gi&&g.owner!==R.actor;
    return g.owner!==R.actor&&!(R.blocked&&R.blocked.pid===R.actor&&R.blocked.gi===gi)};
  const unopened=R.gifts.filter(g=>!g.opened).length;
  const rlabel=r=>`Vuelta ${r} de ${1+R.nchal}`;
  let head='';
  if(R.phase==='play'&&R.pending){
    const pg=R.gifts[R.pending.gi];
    head=`<div class="card center"><p class="muted">${rlabel(1)} · Abrió el regalo #${R.pending.gi+1}${pg.desc?': <b>'+esc(pg.desc)+'</b>':''}</p><p class="huge">${av(R.actor,'1em')} ${esc(nm(R.actor))}</p><div class="timer" id="asrtimer"></div>
    <p>¿Se lo queda, o lo cambia por uno ya abierto${R.peaje?' (pagando peaje 🎡)':''}? El otro se queda con el #${R.pending.gi+1}.</p>
    <button class="b-ok big" onclick="A.asrKeepNew()">🙂 Me lo quedo</button></div>`;
  }else if(R.phase==='play'){

    ${R.blocked&&R.blocked.pid===R.actor?`<p class="muted">No puede recuperar al tiro el regalo #${R.blocked.gi+1}.</p>`:''}</div>`;
  }else if(R.phase==='final'&&R.chal){
    head=chalPanel(R);
  }else if(R.phase==='final'){
    const mine=giftOf(R.actor);const myFrozen=mine>=0&&R.gifts[mine].steals>=R.max;
    head=`<div class="card center"><p class="muted">${rlabel(R.round)} (con desafío) · ${R.r2+1} de ${R.order.length}</p><p class="huge">${av(R.actor,'1em')} ${esc(nm(R.actor))}</p><div class="timer" id="asrtimer"></div>
    ${myFrozen?'<p>Su regalo está congelado 🔒, así que no puede cambiarlo.</p>':'<p>¿Quiere otro regalo? Toca 🎯 en el que quiera. Para llevárselo tiene que <b>ganar un desafío</b>. Si pierde, se queda con el suyo.</p>'}
    <button class="b-ok big" onclick="A.asrKeep()">🙂 Me quedo con el mío</button></div>`;
  }else if(R.phase==='done'){
    head=`<div class="card center"><p class="huge">🎉 ¡Terminó el Gran Juego!</p><p>Así quedaron los regalos:</p></div>`;
  }
  const grid=`<div class="grid g3" style="margin-top:14px">${R.gifts.map((g,gi)=>{
    const fr=g.steals>=R.max;
    return `<div class="gift ${g.opened?'':'closed'} ${fr?'frozen':''}"><div class="row" style="justify-content:space-between"><span class="gn">${g.opened?'':'🎁 '}#${gi+1}</span>${g.opened?`<span class="tag">${fr?'🔒 congelado':'robos: '+'●'.repeat(g.steals)+'○'.repeat(R.max-g.steals)}</span>`:''}</div>
    ${g.opened?`<div class="gd">${esc(g.desc||'(sin descripción)')} <button class="x b-ghost" style="padding:.1em .4em" onclick="A.asrDesc(${gi})">✏️</button></div><div class="go">${av(g.owner)} ${esc(nm(g.owner))}</div>`:'<div class="muted" style="color:#fff">Sin abrir</div>'}
    <div class="acts">${R.phase==='play'&&!R.pending&&!g.opened?`<button class="b-gold" onclick="A.asrOpen(${gi})">Abrir</button>`:''}${(R.phase==='play'||R.phase==='final')&&canSteal(gi)?`<button class="b-red" onclick="A.asrSteal(${gi})">${R.phase==='final'?'🎯 Desafiar':R.pending?'🔄 Cambiar':'🫳 Robar'}</button>`:''}</div></div>`}).join('')}</div>`;
  const order=`<div class="card" style="margin-top:14px"><b>Orden:</b> <div class="order" style="margin-top:6px">${R.order.map((pid,i)=>`<span class="o ${pid===R.actor&&R.phase!=='done'?'cur':''} ${giftOf(pid)>=0?'done':''}">${i+1}. ${esc(nm(pid))}${giftOf(pid)>=0?' 🎁'+(giftOf(pid)+1):''}</span>`).join('')}</div>
   <details><summary>Reglas</summary><ol class="rules">${rules.map(r=>'<li>'+r+'</li>').join('')}</ol></details>
   <details><summary>Historial</summary><div class="muted">${R.log.slice().reverse().map(esc).join('<br>')}</div></details>
   <div class="row" style="margin-top:8px"><button class="b-ghost" onclick="A.asrUndo()" ${S.asrHist.length?'':'disabled'}>↩️ Deshacer</button><button class="b-ghost" onclick="A.asrReset()">🗑️ Empezar de nuevo</button></div></div>`;
  return header('🎁','El Gran Juego',null)+head+grid+order;
};
const CH_GAMES=[['imita','🎭','Imitación','Imita lo que te toca en secreto: deben adivinar en 60 segundos'],['mimica','🙌','Mímica','Te tienen que adivinar 2 palabras en 60 segundos'],['dos','🕵️','Dos verdades y una mentira','La mayoría NO debe descubrir tu mentira'],['absurdas','🤪','Duelo de respuestas absurdas','Tú contra el dueño: la mesa vota la más chistosa'],['quien','🤔','Duelo ¿Quién es más probable…?','Tú contra el dueño: el más votado se lleva el regalo'],['ruleta','🎡','Ruleta del castigo','Cumple el castigo y la mesa juzga']];
const chInfo=k=>CH_GAMES.find(g=>g[0]===k)||CH_GAMES[0];
function chalPanel(R){
  const c=R.chal, T=c.thief, V=c.victim, g=R.gifts[c.gi];
  const top=`<p class="muted">Vuelta ${R.round} de ${1+R.nchal} · Desafío</p><p class="prompt" style="font-size:1.7em">${av(T,'1em')} ${esc(nm(T))} quiere el #${c.gi+1}${g.desc?' ('+esc(g.desc)+')':''} de ${av(V,'1em')} ${esc(nm(V))}</p>`;
  const cancel=`<button class="b-ghost" onclick="A.asrUndo()">↩️ Cancelar desafío</button>`;
  if(c.stage==='pick') return `<div class="card center">${top}<div class="shuffle" id="chshuf" style="padding:10px">🎯</div>
    <p><button class="b-gold big" onclick="A.chalRandom()">🎲 Sortear desafío</button></p><p class="muted">o elige uno:</p>
    <div class="row" style="justify-content:center">${CH_GAMES.map(x=>`<button class="b-ghost" onclick="A.chalSet('${x[0]}')">${x[1]} ${x[2]}</button>`).join('')}</div><p>${cancel}</p></div>`;
  const info=chInfo(c.game);
  const ttl=`<h2>${info[1]} ${info[2]}</h2><p class="muted">${info[3]}</p>`;
  if(c.stage==='result') return `<div class="card center">${top}${ttl}<p class="huge" style="color:${c.pass?'var(--ok)':'var(--red)'}">${c.pass?'✅ ¡Ganó el desafío!':'❌ No lo logró'}</p>
    <p>${c.pass?esc(nm(T))+' se lleva el #'+(c.gi+1)+' y '+esc(nm(V))+' se queda con el regalo de '+esc(nm(T))+'.':esc(nm(T))+' se queda con su regalo.'}</p>${c.note?'<p class="muted">'+c.note+'</p>':''}
    <button class="b-gold big" onclick="A.chalApply()">Continuar ➜</button></div>`;
  let body='';
  if(c.game==='ruleta') body=`<button class="b-red big" onclick="A.chalWheel()">🎡 Girar la ruleta</button>`;
  else if(c.game==='imita'||c.game==='mimica'){
    const peek=`<button class="b-ghost" onclick="A.chalPeek()">👀 Ver ${c.game==='imita'?'secreto':'palabra'} (solo ${esc(nm(T))})</button>`;
    if(c.stage==='ready') body=`<p>${online(T)?'📱 Le llega a su celular cuando empiece.':'Sin celular: que mire solo él/ella con el botón 👀.'}</p><div class="row" style="justify-content:center">${c.game==='imita'?peek:''}<button class="b-gold big" onclick="A.chalGo()">▶️ Empezar 60 s</button></div>`;
    else body=`<div class="timer" id="chtimer"></div>${c.game==='mimica'?`<p class="prompt" style="font-size:1.5em">Adivinadas: ${c.got||0} de 2</p>`:''}
      <div class="row" style="justify-content:center">${peek}${c.game==='mimica'?`<button class="b-ok big" onclick="A.chalGot()">✅ ¡Adivinaron!</button><button class="b-ghost big" onclick="A.chalSkip()">⏭ Pasar</button>`:`<button class="b-ok big" onclick="A.chalEnd(true)">✅ ¡Adivinaron!</button>`}<button class="b-red" onclick="A.chalEnd(false)">❌ No lo lograron</button></div>`;
  }
  else if(c.game==='dos'){
    const voters=S.players.map(p=>p.pid).filter(p=>p!==T);
    const opts=c.stmts?c.stmts.map((s,i)=>({id:String(i+1),label:(i+1)+'. '+s})):[1,2,3].map(n=>({id:String(n),label:'Frase '+n}));
    body=(c.stmts?c.stmts.map((s,i)=>`<div class="ansbox"><span class="num">${i+1}</span>${esc(s)}</div>`).join(''):`<p class="prompt" style="font-size:1.4em">${esc(nm(T))} dice 3 cosas de su vida en voz alta (frase 1, 2 y 3). Dos verdaderas y una mentira.</p>
      <p>Mentira: ${c.lie?'<b>✅ marcada en secreto</b>':'<span class="muted">la marca en su celular o aquí sin que nadie mire</span>'}</p><div class="row" style="justify-content:center">${[1,2,3].map(n=>`<button class="b-ghost" onclick="A.chalLie('${n}')">${c.lie===String(n)?'●':'○'} ${n}</button>`).join('')}</div>`)
      +`<p class="muted">¿Cuál es la mentira? Voten en el celular.</p>`+votedLine(c,voters)+manualTally(c,opts)+`<p><button class="b-red big" ${c.lie?'':'disabled'} onclick="A.chalDosReveal()">🥁 Revelar</button></p>`;
  }
  else if(c.game==='absurdas'){
    const fill=esc(c.prompt).replace('____','<span style="color:var(--gold)">______</span>');
    if(c.stage==='write') body=`<p class="prompt" style="font-size:1.6em">${fill}</p><p>${[T,V].map(p=>`${esc(nm(p))}: ${c.texts[p]?'✅ lista':online(p)?'✍️ escribiendo en el celular…':'<input id="cht_'+p+'" placeholder="Respuesta de '+esc(nm(p))+'" maxlength="80"><button onclick="A.chalManText(\''+p+'\')">OK</button>'}`).join('<br>')}</p>
      <button class="b-gold big" ${c.texts[T]&&c.texts[V]?'':'disabled'} onclick="A.chalAbsVote()">📜 Mostrar y votar</button>`;
    else body=`<p class="prompt" style="font-size:1.6em">${fill}</p>${c.order.map((p,i)=>`<div class="ansbox"><span class="num">${'AB'[i]}</span>${esc(c.texts[p])}</div>`).join('')}`+votedLine(c,S.players.map(p=>p.pid).filter(p=>p!==T&&p!==V))+manualTally(c,c.order.map((p,i)=>({id:p,label:'Respuesta '+'AB'[i]})))+`<p><button class="b-red big" onclick="A.chalDuelReveal()">🥁 Revelar</button></p>`;
  }
  else if(c.game==='quien'){
    body=`<p class="muted">¿Quién es más probable que…</p><p class="prompt">${esc(c.prompt)}?</p><p>Voten entre ${esc(nm(T))} y ${esc(nm(V))}. <b>¡El más votado se lleva el regalo!</b></p>`+votedLine(c,S.players.map(p=>p.pid).filter(p=>p!==T&&p!==V))+manualTally(c,[T,V].map(p=>({id:p,label:nm(p)})))+`<p><button class="b-red big" onclick="A.chalDuelReveal()">🥁 Revelar</button></p>`;
  }
  return `<div class="card center">${top}${ttl}${body}<p style="margin-top:10px">${cancel}</p></div>`;
}

/* ---------- ruleta (rueda) ---------- */
let wheelRot=0;
function wheelSVG(){
  const items=S.castigos, n=items.length, seg=360/n, R=100;
  const cols=['#e2433b','#1f7a4a','#f5c542','#2f6fb3','#b8302a','#2a9a5f','#e8a33a','#7a4bb3'];
  let s=`<svg viewBox="-105 -105 210 210" class="wheel" style="transform:rotate(${wheelRot}deg)">`;
  items.forEach((it,i)=>{
    const a0=(i*seg-90)*Math.PI/180,a1=((i+1)*seg-90)*Math.PI/180;
    const x0=R*Math.cos(a0),y0=R*Math.sin(a0),x1=R*Math.cos(a1),y1=R*Math.sin(a1);
    const am=((i+.5)*seg-90)*Math.PI/180;
    s+=`<path d="M0 0 L${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 ${seg>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z" fill="${cols[i%cols.length]}" stroke="#fff" stroke-width="1"/>`;
    s+=`<text x="${(70*Math.cos(am)).toFixed(2)}" y="${(70*Math.sin(am)).toFixed(2)}" font-size="${n>12?13:16}" text-anchor="middle" dominant-baseline="central">${esc(it[0])}</text>`;
  });
  return s+`<circle r="14" fill="#fdf8ee" stroke="#f5c542" stroke-width="3"/><text font-size="14" text-anchor="middle" dominant-baseline="central">🎄</text></svg>`;
}
let modalFail=null;
function openWheel(title,pid,after,onFail){
  modalAfter=after||null;modalFail=onFail||null;
  $('#modal').innerHTML=`<div class="modal"><div class="box"><h2>🎡 ${esc(title)}</h2>${pid?`<p class="huge" style="font-size:2.4em">${esc(nm(pid))}</p>`:''}
  <div class="wheelwrap"><div class="pointer"></div>${wheelSVG()}</div><div id="wres"></div>
  <div class="row" style="justify-content:center" id="wbtns"><button class="b-red big" id="spinbtn" onclick="A.spin()">¡Girar!</button><button class="b-ghost" onclick="A.closeModal(false)">Cancelar</button></div></div></div>`;
}

/* ---------- temporizadores ---------- */
function fmt(s){s=Math.max(0,Math.ceil(s));return s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):String(s)}
function tick(){
  const now=Date.now();
  const im=$('#imtimer'); if(im&&S.g.start) im.textContent=Math.floor((now-S.g.start)/1000)+'s';
  const ct=$('#chtimer'),C=S.asr&&S.asr.chal; if(ct&&C&&C.end){const left=(C.end-now)/1000;ct.textContent=left>0?fmt(left):'⏰ ¡Tiempo!';ct.classList.toggle('low',left<=10);if(left<=0&&C.game==='mimica'&&C.stage==='go')A.chalEnd(false)}
  const mm=$('#mmtimer'); if(mm&&S.g.end){const left=(S.g.end-now)/1000;mm.textContent=fmt(left);mm.classList.toggle('low',left<=10);if(left<=0&&S.g.phase==='playing')A.mEnd()}
  const at=$('#asrtimer'); if(at&&S.asr&&S.asr.turnEnd){const left=(S.asr.turnEnd-now)/1000;at.textContent=left>0?'⏳ '+fmt(left):'⏰ ¡Se acabó el tiempo! Decide ya';at.classList.toggle('low',left<=10)}
}
setInterval(tick,250);

        R.log.push(nm(thief)+' cambió el #'+(R.pending.gi+1)+' por el #'+(gi+1)+' de '+nm(victim)+(g.steals>=R.max?' (🔒 congelado)':''));A.asrNextTurn()}

    else R.actor=R.order[R.r2];

  asrKeep(){const R=S.asr;A.asrSnap();R.log.push(nm(R.actor)+' se quedó con su regalo');A.asrR2Next();save();render()},
  asrUndo(){const s=S.asrHist.pop();if(!s)return;S.asr=JSON.parse(s);S.asr.turnEnd=Date.now()+S.asr.secs*1000;$('#modal').innerHTML='';modalAfter=null;modalFail=null;A.asrPhones();save();render()},
  asrReset(){if(!confirm('¿Borrar el amigo secreto y empezar de nuevo?'))return;S.asr={phase:'setup',sel:S.asr&&S.asr.sel};S.asrHist=[];save();render()},
  /* desafíos */
  chalRandom(){const c=S.asr.chal;if(!c||c.stage!=='pick')return;const fin=pick(CH_GAMES);let k=0;const b=document.querySelectorAll('.card button');b.forEach(x=>x.disabled=true);
    const iv=setInterval(()=>{const e=$('#chshuf');if(e){const x=CH_GAMES[k++%CH_GAMES.length];e.textContent=x[1]+' '+x[2]}},110);

  chalSet(game){const R=S.asr,c=R.chal;if(!c)return;c.game=game;c.key=uid();c.answers={};c.manual={};const T=c.thief,V=c.victim,TP=P(T)||{};
    const others=[T,V];

    if(game==='imita'){c.stage='ready';const pool=S.players.filter(p=>p.pid!==T).map(p=>p.nick?p.name+' ('+p.nick+')':p.name);c.target=Math.random()<.5&&pool.length?pick(pool):pick(IMITA_PERSONAJES);
      sendView(T,{v:'secret',title:'🤫 Desafío: imita a',text:c.target,note:'Actúa y habla como esa persona o personaje, ¡sin decir el nombre! Tienen 60 segundos para adivinar.'});

    if(game==='mimica'){c.stage='ready';c.got=0;broadcast({v:'wait',msg:'🙌 Mímica de '+nm(T)+': ¡adivinen 2 palabras!'},[T]);sendView(T,{v:'wait',msg:'🙌 Prepárate: la palabra aparece aquí cuando empiece'})}
    if(game==='dos'){c.stage='vote';c.lie=null;c.stmts=null;
      if(TP.t1&&TP.t2&&TP.lie){const arr=shuffle([[TP.t1,0],[TP.t2,0],[TP.lie,1]]);c.stmts=arr.map(a=>a[0]);c.lie=String(arr.findIndex(a=>a[1])+1)}
      const opts=c.stmts?c.stmts.map((s,i)=>({id:String(i+1),label:(i+1)+'. '+s})):[1,2,3].map(n=>({id:String(n),label:'Frase '+n}));
      broadcast({v:'vote',key:c.key,prompt:'¿Cuál es la mentira de '+nm(T)+'?',options:opts},[T]);
      if(!c.stmts)sendView(T,{v:'vote',key:c.key+'L',prompt:'🤫 Secreto: ¿cuál de tus frases es la mentira?',options:opts});else sendView(T,{v:'wait',msg:'🤫 Pon cara de póker…'})}
    if(game==='absurdas'){c.stage='write';c.texts={};c.prompt=pick(P_ABSURDAS);broadcast({v:'wait',msg:'🤪 Duelo: '+nm(T)+' vs '+nm(V)+' están escribiendo…'},others);
      others.forEach(p=>sendView(p,{v:'text',key:c.key,prompt:c.prompt}))}
    if(game==='quien'){c.stage='vote';c.prompt=pick(Q_PROBABLE);
      broadcast({v:'vote',key:c.key,prompt:'¿Quién es más probable que '+c.prompt+'?',options:[T,V].map(p=>({id:p,label:nm(p)}))},others);
      others.forEach(p=>sendView(p,{v:'wait',msg:'🤔 La mesa está votando entre tú y '+nm(p===T?V:T)+'…'}))}
    save();render()},
  chalWheel(){const c=S.asr.chal;openWheel('Desafío: ruleta del castigo',c.thief,()=>A.chalEnd(true),()=>A.chalEnd(false))},

  chalWord(){const c=S.asr.chal;let pool=MIMICA.filter(w=>!S.used.m.includes(w));if(!pool.length){S.used.m=[];pool=MIMICA}c.word=pick(pool);S.used.m.push(c.word);c.key=uid();sendView(c.thief,{v:'mimic',key:c.key,word:c.word})},
  chalGo(){const c=S.asr.chal;c.stage='go';c.end=Date.now()+60000;if(c.game==='mimica')A.chalWord();save();render()},
  chalGot(){const c=S.asr.chal;if(!c||c.stage!=='go')return;c.got=(c.got||0)+1;if(c.got>=2){A.chalEnd(true);return}A.chalWord();save();render()},

function onAnswer(pid,key,val){
  if(key==='profile'){setProfile(pid,val);sendView(pid,globalView);return}
  const R=S.asr,c=R&&R.chal;
  if(S.screen==='asr'&&c){
    if(key===c.key+'L'&&pid===c.thief&&c.game==='dos'){if(['1','2','3'].includes(String(val))){c.lie=String(val);save();render()}return}
    if(c.game==='mimica'&&c.stage==='go'&&key===c.key&&pid===c.thief){val==='ok'?A.chalGot():A.chalSkip();return}
    if(c.game==='absurdas'&&c.stage==='write'&&key===c.key&&(pid===c.thief||pid===c.victim)){const t=String(val||'').trim().slice(0,80);if(t){c.texts[pid]=t;save();render()}return}
    if(c.stage==='vote'&&(key===c.key||key===c.vkey)&&pid!==c.thief&&(c.game==='dos'||pid!==c.victim)){c.answers[pid]=String(val);save();render()}
    return}
  const g=S.g;
  if(g.key&&key===g.key+'L'&&S.screen==='dos'){if(['1','2','3'].includes(String(val)))g.lie=String(val);save();render();return}
  if(S.screen==='mimica'&&g.phase==='playing'&&key===g.key&&pid===g.actor){val==='ok'?A.mGot():A.mSkip();return}
  if(S.screen==='absurdas'&&g.phase==='write'&&key===g.key){const t=String(val||'').trim().slice(0,80);if(t){g.texts[pid]=t;save();render()}return}
  if(S.screen==='absurdas'&&g.phase==='vote'&&key===g.vkey){if(val!==pid&&g.order.includes(val)){g.answers[pid]=val;save();render()}return}
  if(key===g.key&&g.phase==='vote'){g.answers[pid]=String(val);save();render()}
}
render(); startPeer();
if(S.screen==='asr'&&S.asr&&S.asr.phase==='shuffle'){S.asr.phase='play';S.asr.turnEnd=Date.now()+S.asr.secs*1000;save();render()}
}

function playerMain(code){
  let dev=store.get('cg_dev',null); if(!dev){dev='d'+uid()+uid();store.set('cg_dev',dev)}
  let name=store.get('cg_name',''); let peer=null, conn=null, view=null, status='', myName='', sent={};
  const app=$('#app');
  function shell(inner){app.innerHTML=`<div class="phone"><div class="row" style="justify-content:space-between"><b>🎄 Comando Garra</b><span class="status">${esc(myName?myName+' · ':'')}${esc(status)}</span></div>${inner}</div>`}
  function joinForm(){shell(`<div class="card center" style="margin-top:20px"><h2>¡Bienvenido a la cena!</h2><p>Sala <b style="color:var(--gold)">${esc(code)}</b></p><p>¿Cómo te llamas?</p><input id="nm" maxlength="24" value="${esc(name)}" style="width:100%;font-size:1.3em" placeholder="Tu nombre" onkeydown="if(event.key==='Enter')JOIN()"><p><button class="b-gold big" style="width:100%" onclick="JOIN()">Entrar 🎅</button></p></div>`)}
  window.JOIN=()=>{const n=($('#nm').value||'').trim().slice(0,24);if(!n)return;name=n;store.set('cg_name',n);connect()};
  function connect(){
    status='Conectando…';shell(`<div class="card center" style="margin-top:20px"><p class="prompt">⏳</p><p>Conectando con la pantalla…</p></div>`);
    if(typeof Peer==='undefined'){status='';shell('<div class="card center">No se pudo cargar. Revisa el wifi y recarga.</div>');return}
    if(!peer||peer.destroyed){peer=new Peer(peerOpts());peer.on('open',dial);peer.on('error',e=>{if(e.type==='peer-unavailable'){status='Pantalla no encontrada';draw();setTimeout(dial,3000)}else if(['network','server-error','socket-error'].includes(e.type)){status='Sin conexión';draw();setTimeout(()=>{try{peer.destroy()}catch(x){}connect()},4000)}});peer.on('disconnected',()=>{try{peer.reconnect()}catch(x){}})}
    else if(peer.open)dial();
  }
  function dial(){
    try{conn&&conn.close()}catch(e){}
    conn=peer.connect(PREFIX+code,{reliable:true});
    conn.on('open',()=>{status='Conectado ✅';conn.send({t:'hello',pid:dev,name})});
    conn.on('data',d=>{if(!d)return;if(d.t==='welcome'){myName=d.name;draw()}else if(d.t==='view'){view=d.view;draw()}});
    conn.on('close',()=>{status='Reconectando…';draw();setTimeout(dial,2000)});
  }
  window.ANS=(key,val)=>{sent[key]=val;try{conn.send({t:'ans',key,val})}catch(e){}draw()};
  window.SENDTXT=key=>{const t=($('#ptxt').value||'').trim();if(t)ANS(key,t)};
  window.EDIT=key=>{delete sent[key];draw()};
  let prof=store.get('cg_prof',{}), pstep=0;
  const EMO=['🎅','🤶','🦌','⛄','🎄','🌟','🐧','🐻','🦊','🐱','🐶','🐵','🦁','🐸','🦄','🐙','🦖','🤖','👽','🥳','😎','🤠','🧙','🦸'];
  const saveProf=()=>{const c=Object.assign({},prof);try{store.set('cg_prof',c)}catch(e){}};
  const field=(k,ph,big)=>big?`<textarea id="pf" maxlength="90" placeholder="${ph}">${esc(prof[k]||'')}</textarea>`:`<input id="pf" maxlength="60" style="width:100%;font-size:1.2em" value="${esc(prof[k]||'')}" placeholder="${ph}">`;
  const STEPS=[
    {k:null,q:()=>`¡Hola ${esc(name)}! 🎅`,sub:'Bienvenido a la cena del Comando Garra. Te vamos a hacer unas preguntitas para presentarte en la tele. 📺',btn:'¡Vamos!'},
    {k:'nick',q:()=>'¿Cómo te dicen?',sub:'Tu apodo o cómo te conoce la familia',ph:'Ej: El Tata, La Flaca, Campeón'},
    {k:'emoji',q:()=>'Elige tu personaje',sub:'O sácate una selfie navideña 📸',custom:()=>`<div class="center">${EMO.map(e=>`<button class="emo ${prof.emoji===e?'sel':''}" onclick="PEMO('${e}')">${e}</button>`).join('')}</div>
      <p class="center">${prof.photo?`<img src="${prof.photo}" class="av" style="width:90px;height:90px"><br><button class="b-ghost" onclick="PNOPHOTO()">Quitar foto</button>`:''}</p>
      <label class="center" style="display:block"><span class="b-ghost" style="display:inline-block;padding:.7em 1.1em;border-radius:14px;border:2px solid var(--line);font-weight:700">📸 Selfie</span><input type="file" accept="image/*" capture="user" style="display:none" onchange="PPHOTO(this)"></label>`},
    {k:'talent',q:()=>'¿Cuál es tu talento oculto? 🌟',sub:'Algo que haces muy bien (o muy mal, pero con ganas)',ph:'Ej: silbar villancicos, dormir en cualquier parte'},
    {k:'food',q:()=>'¿Tu comida favorita de Navidad? 🍗',sub:'',ph:'Ej: pan de pascua, pavo, cola de mono'},
    {k:'t1',q:()=>'🤫 Juego secreto: escribe una VERDAD sobre ti',sub:'Algo real que pocos sepan. Nadie verá esto todavía.',ph:'Ej: una vez me caí a una piscina con ropa',big:1},
    {k:'t2',q:()=>'🤫 Otra VERDAD sobre ti',sub:'Otra cosa real y sorprendente',ph:'Ej: sé tocar el acordeón',big:1},
    {k:'lie',q:()=>'😈 Ahora una MENTIRA creíble',sub:'Inventa algo que parezca verdad. ¡A ver si los engañas!',ph:'Ej: conocí a un futbolista famoso en un ascensor',big:1},
    {k:null,q:()=>'¡Listo! 🎉',sub:'Toca enviar y mira la tele: te van a presentar.',btn:'Enviar 🎤',last:1}
  ];
  window.PEMO=e=>{prof.emoji=e;saveProf();draw()};
  window.PNOPHOTO=()=>{prof.photo=null;saveProf();draw()};
  window.PPHOTO=inp=>{const f=inp.files&&inp.files[0];if(!f)return;const img=new Image();const url=URL.createObjectURL(f);
    img.onload=()=>{const s=220,cv=document.createElement('canvas');cv.width=s;cv.height=s;const m=Math.min(img.width,img.height);cv.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);prof.photo=cv.toDataURL('image/jpeg',.72);URL.revokeObjectURL(url);saveProf();draw()};img.src=url};
  window.PNEXT=d=>{const st=STEPS[pstep];const i=$('#pf');if(st.k&&i)prof[st.k]=i.value.trim();saveProf();
    if(d>0&&st.last){try{conn.send({t:'ans',key:'profile',val:prof})}catch(e){}view={v:'wait',msg:'📺 ¡Mira la tele!'};draw();return}
    pstep=Math.max(0,Math.min(STEPS.length-1,pstep+d));draw();setTimeout(()=>{const n=$('#pf');n&&n.focus()},50)};
  function drawProfile(){const st=STEPS[pstep];
    shell(`<div class="card" style="margin-top:14px"><p class="status">Paso ${pstep+1} de ${STEPS.length}</p><p class="prompt" style="font-size:1.5em">${st.q()}</p>${st.sub?`<p class="center">${st.sub}</p>`:''}
    ${st.custom?st.custom():st.k?field(st.k,st.ph,st.big):''}
    <div class="row" style="margin-top:12px">${pstep>0?'<button class="b-ghost" onclick="PNEXT(-1)">← Atrás</button>':''}<span style="flex:1"></span><button class="b-gold big" onclick="PNEXT(1)">${st.btn||'Siguiente →'}</button></div></div>`)}
  function draw(){
    const v=view;
    if(v&&v.v==='profile')return drawProfile();
    if(!v){shell(`<div class="card center" style="margin-top:20px"><p class="prompt">⏳</p><p>${esc(status)}</p></div>`);return}
    if(v.v==='wait') return shell(`<div class="card center" style="margin-top:20px"><p class="prompt" style="font-size:1.8em">${esc(v.msg)}</p></div>`);
    if(v.v==='vote') return shell(`<div class="card" style="margin-top:14px"><p class="prompt" style="font-size:1.4em">${esc(v.prompt)}</p>${v.options.map(o=>`<button class="opt ${sent[v.key]===o.id?'sel':''}" onclick='ANS(${JSON.stringify(v.key)},${JSON.stringify(o.id)})'>${esc(o.label)}</button>`).join('')}${sent[v.key]!==undefined?'<p class="center">✅ Voto enviado. Puedes cambiarlo hasta que revelen.</p>':''}</div>`);
    if(v.v==='text'){const done=sent[v.key];return shell(`<div class="card" style="margin-top:14px"><p class="prompt" style="font-size:1.4em">${esc(v.prompt)}</p>${done?`<p class="ansbox">${esc(done)}</p><p class="center">✅ Enviada</p><button class="b-ghost" style="width:100%" onclick='EDIT(${JSON.stringify(v.key)})'>Cambiar</button>`:`<textarea id="ptxt" maxlength="80" placeholder="Tu respuesta más chistosa (sin groserías 😇)"></textarea><button class="b-gold big" style="width:100%;margin-top:8px" onclick='SENDTXT(${JSON.stringify(v.key)})'>Enviar</button>`}</div>`)}
    if(v.v==='secret') return shell(`<div class="card center" style="margin-top:14px"><p>${esc(v.title)}</p><div class="secret" onclick="const t=this.children;t[0].hidden=!t[0].hidden;t[1].hidden=!t[1].hidden"><p class="huge" style="font-size:2.4em" hidden>${esc(v.text)}</p><p style="font-size:1.4em">👆 Toca aquí para ver</p></div><p class="muted">Toca de nuevo para ocultar. ¡Que nadie más mire!</p><p>${esc(v.note||'')}</p></div>`);
    if(v.v==='mimic') return shell(`<div class="card center" style="margin-top:14px"><p>🤫 Actúa sin hablar:</p><div class="secret"><p class="huge" style="font-size:2.6em">${esc(v.word)}</p></div><button class="b-ok big" style="width:100%;margin:6px 0" onclick='ANS(${JSON.stringify(v.key)},"ok")'>✅ ¡Adivinaron!</button><button class="b-ghost big" style="width:100%" onclick='ANS(${JSON.stringify(v.key)},"skip")'>⏭ Pasar</button></div>`);
    shell('<div class="card">…</div>');
  }
  if(name) connect(); else joinForm();
}
</script>
</body>
</html>
